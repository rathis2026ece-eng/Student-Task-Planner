<!DOCTYPE html>
<html>
<head>
    <title>Student Task Planner</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 12px;
        }

        h1 {
            color: #2c3e50;
        }

        input {
            padding: 10px;
            width: 65%;
        }

        button {
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }

        li {
            margin: 10px;
            text-align: left;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Task Planner</h1>

        <p>Organize your day and manage your tasks!</p>

        <input type="text" id="taskInput" placeholder="Enter your task">

        <button onclick="addTask()">Add Task</button>

        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            let taskInput = document.getElementById("taskInput");
            let task = taskInput.value;

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            let li = document.createElement("li");
            li.textContent = task;

            li.onclick = function() {
                li.classList.toggle("completed");
            };

            document.getElementById("taskList").appendChild(li);

            taskInput.value = "";
        }
    </script>

</body>
</html>
